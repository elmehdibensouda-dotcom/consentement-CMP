version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Africa/Casablanca
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: Africa/Casablanca
    open-pull-requests-limit: 5

  - package-ecosystem: gradle
    directory: /mobile/android
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Africa/Casablanca
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /mobile/react-native
    schedule:
      interval: weekly
      day: monday
      time: "09:45"
      timezone: Africa/Casablanca
    open-pull-requests-limit: 5
