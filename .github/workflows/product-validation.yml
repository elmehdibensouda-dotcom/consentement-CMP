name: Product validation

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-validation-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  staging-container:
    name: Staging container image
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Build staging API and console image
        run: docker build --file Dockerfile --tag alamane-api:staging .

  backend-and-web:
    name: Backend and web SDK
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - name: Install API dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run backend regression suite
        run: python -m unittest discover backend/tests -v

  web-sdk:
    name: Web SDK and source preview
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Set up Node for the Web SDK
        uses: actions/setup-node@v6.0.0
        with:
          node-version: "22"
      - name: Check Web SDK syntax
        run: |
          node --check aman-cmp.js
          node --check aman-scanner.js
      - name: Run Web SDK browser regressions
        env:
          # Ubuntu 24.04 runners restrict the Chrome user-namespace sandbox; the pages are local fixtures.
          CHROME_FLAGS: --no-sandbox
        run: bash scripts/run-web-sdk-tests.sh
      - name: Prepare traceable Web source preview
        if: github.event_name == 'workflow_dispatch'
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          bundle="$RUNNER_TEMP/alamane-web-preview"
          mkdir -p "$bundle"
          cp aman-cmp.js "$bundle/"
          cp SDK_WEB.md "$bundle/WEB-INTEGRATION.md"
          {
            echo "source_commit=$SOURCE_COMMIT"
            echo "workflow_run=$WORKFLOW_RUN_URL"
            echo "artifact_type=Web SDK source preview; not a signed or production release"
          } > "$bundle/BUILD-INFO.txt"
          cd "$bundle"
          sha256sum aman-cmp.js WEB-INTEGRATION.md > SHA256SUMS
      - name: Attach Web source preview for manual runs
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: alamane-web-preview-${{ github.sha }}
          path: ${{ runner.temp }}/alamane-web-preview/
          if-no-files-found: error
          retention-days: 14

  android-sdk:
    name: Android SDK and sample build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Set up Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.0
        with:
          gradle-version: "9.6.0"
          cache-provider: basic
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.0
        with:
          packages: platforms;android-36
      - name: Build Android library and sample
        working-directory: mobile/android
        run: gradle --no-daemon :aman-consent:assembleRelease :sample:assembleDebug
      - name: Publish Android SDK to a local Maven repository
        working-directory: mobile/android
        run: gradle --no-daemon :aman-consent:publish
      - name: Set up Node for the React Native pilot package
        uses: actions/setup-node@v6.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/react-native/package-lock.json
      - name: Install React Native package build dependencies
        working-directory: mobile/react-native
        run: npm ci --legacy-peer-deps
      - name: Pack the React Native pilot package
        working-directory: mobile/react-native
        run: npm pack --pack-destination "$RUNNER_TEMP"
      - name: Generate the React Native dependency SBOM
        working-directory: mobile/react-native
        run: npm sbom --sbom-format cyclonedx --legacy-peer-deps > "$RUNNER_TEMP/alamane-react-native.sbom.cdx.json"
      - name: Prepare traceable preview bundle
        if: github.event_name == 'workflow_dispatch'
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          bundle="$RUNNER_TEMP/alamane-mobile-preview"
          mkdir -p "$bundle"
          cp -R mobile/android/aman-consent/build/repository "$bundle/maven-repository"
          cp mobile/android/sample/build/outputs/apk/debug/sample-debug.apk "$bundle/"
          mkdir -p "$bundle/react-native"
          cp "$RUNNER_TEMP/aman-consent-react-native-0.1.0.tgz" "$bundle/react-native/"
          cp "$RUNNER_TEMP/alamane-react-native.sbom.cdx.json" "$bundle/react-native/"
          {
            echo "source_commit=$SOURCE_COMMIT"
            echo "workflow_run=$WORKFLOW_RUN_URL"
            echo "artifact_type=preview; APK uses the Android debug key; not a production release"
            echo "android_distribution=local Maven repository with AAR, POM, Gradle module metadata, and sources"
            echo "sbom_scope=React Native package lock dependency graph only; not Android/iOS dependencies, full repository, or platform image inventory"
          } > "$bundle/BUILD-INFO.txt"
          cd "$bundle"
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - name: Attach mobile preview bundle for manual runs
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: alamane-mobile-preview-${{ github.sha }}
          path: ${{ runner.temp }}/alamane-mobile-preview/
          if-no-files-found: error
          retention-days: 14

  ios-sdk:
    name: iOS SDK compile
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Compile for the iOS simulator
        run: swift build --package-path . --sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" --triple arm64-apple-ios16.0-simulator
      - name: Compile the distributable Swift package for the iOS simulator
        run: swift build --package-path mobile/ios --sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" --triple arm64-apple-ios16.0-simulator
      - name: Prepare traceable iOS source preview
        if: github.event_name == 'workflow_dispatch'
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          bundle="$RUNNER_TEMP/alamane-ios-preview"
          mkdir -p "$bundle"
          tar -czf "$bundle/aman-consent-ios-source.tar.gz" -C mobile ios
          {
            echo "source_commit=$SOURCE_COMMIT"
            echo "workflow_run=$WORKFLOW_RUN_URL"
            echo "artifact_type=Swift Package source preview; no signed binary, SBOM, or production release"
          } > "$bundle/BUILD-INFO.txt"
          cd "$bundle"
          shasum -a 256 aman-consent-ios-source.tar.gz > SHA256SUMS
      - name: Attach iOS source preview for manual runs
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: alamane-ios-preview-${{ github.sha }}
          path: ${{ runner.temp }}/alamane-ios-preview/
          if-no-files-found: error
          retention-days: 14
